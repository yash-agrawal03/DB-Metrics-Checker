spring:
  application:
    name: db-metrics-checker
  
  # MySQL Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/benchmark?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  # Alternative credentials (for non-root access)
  # username: repl
  # password: ci
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  
  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

# Aerospike Configuration
dbmetrics:
  aerospike:
    enabled: true
    host: localhost
    port: 3000
    namespace: benchmark
    set: records
    max-conns-per-node: 100
    timeout: 5000
  
  mysql:
    enabled: true
  
  redis:
    enabled: true

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    com.dbmetrics: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

